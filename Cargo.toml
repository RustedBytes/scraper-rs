[package]
name = "scraper-rs"
version = "0.5.1"
edition = "2024"

[lib]
name = "scraper_rs"
crate-type = ["cdylib", "rlib"]
doctest = false
bench = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
rayon = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

xee-xpath = "0.1.5"
rustedbytes-tl = { version = "0.2.0", features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
pyo3-build-config = { version = "0.28.3", features = ["resolve-config"] }

[[bench]]
name = "sync_async"
path = "benchmarks/sync_async.rs"
harness = false

[[bench]]
name = "parse_scaling"
path = "benchmarks/parse_scaling.rs"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
