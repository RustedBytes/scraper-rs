[package]
name = "scraper-rs"
version = "0.16.2"
edition = "2024"

[lib]
name = "scraper_rs"
crate-type = ["cdylib", "rlib"]
doctest = false
bench = false

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py310", "pyo3/abi3t-py315"]
extension-module = ["pyo3/extension-module"]

[dependencies]
html-escape = "0.2.15"
pyo3 = { version = "0.29.2" }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
rayon = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }

xee-xpath = "0.1.5"
rustedbytes-tl = { version = "0.3.0", features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
pyo3-build-config = { version = "0.29.2", features = ["resolve-config"] }

# PyPy 3.12 changed its C-extension symbol mapping. Pin PyO3's upstream
# compatibility patch until it is included in a crates.io release.
# https://github.com/PyO3/pyo3/pull/6448
[patch.crates-io]
pyo3-build-config = { git = "https://github.com/PyO3/pyo3", rev = "dd54cd6e129439ab2c5d98ff11f06f1e0ea85cd6" }
pyo3-ffi = { git = "https://github.com/PyO3/pyo3", rev = "dd54cd6e129439ab2c5d98ff11f06f1e0ea85cd6" }

[[bench]]
name = "sync_async"
path = "benchmarks/sync_async.rs"
harness = false

[[bench]]
name = "parse_scaling"
path = "benchmarks/parse_scaling.rs"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[[bench]]
name = "boundaries"
path = "benchmarks/boundaries.rs"
harness = false

[[bench]]
name = "allocations"
path = "benchmarks/allocations.rs"
harness = false
