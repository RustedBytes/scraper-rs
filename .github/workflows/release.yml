name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: windows
            runner: windows-latest
            platform: windows
          - name: macos
            runner: macos-latest
            platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install zig (for Linux manylinux builds)
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build wheels (Linux)
        if: matrix.platform == 'linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist --zig --interpreter python3.10

      - name: Verify Linux wheels are abi3
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels were built in dist/" >&2
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            name="$(basename "$wheel")"
            if [[ "$name" != *abi3* ]]; then
              echo "Expected abi3 Linux wheel, got: $name" >&2
              exit 1
            fi
          done

      - name: Build wheels (Windows/macOS)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload sdist to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/scraper-rust
    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'sdist'
          merge-multiple: true

      - name: Validate distributions
        run: |
          ls -lah dist/
          python - <<'PY'
          from pathlib import Path
          import struct
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))

          if len(wheels) != 4:
              raise SystemExit(f"Expected 4 platform wheels, found {len(wheels)}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected 1 source distribution, found {len(sdists)}")

          for wheel in wheels:
              data = wheel.read_bytes()
              eocd = data.rfind(b"PK\x05\x06")
              if eocd < 0 or eocd + 22 > len(data):
                  raise SystemExit(f"{wheel}: missing or truncated ZIP end record")

              comment_length = struct.unpack_from("<H", data, eocd + 20)[0]
              archive_end = eocd + 22 + comment_length
              if comment_length:
                  raise SystemExit(f"{wheel}: ZIP comments are not accepted by PyPI")
              if archive_end != len(data):
                  trailing = len(data) - archive_end
                  raise SystemExit(f"{wheel}: contains {trailing} trailing bytes")

              with zipfile.ZipFile(wheel) as archive:
                  bad_member = archive.testzip()
                  if bad_member is not None:
                      raise SystemExit(f"{wheel}: corrupt member {bad_member}")

          with tarfile.open(sdists[0], mode="r:gz") as archive:
              archive.getmembers()

          print(f"Validated {len(wheels)} wheels and {len(sdists)} source distribution")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
