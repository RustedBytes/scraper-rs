name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: windows
            runner: windows-latest
            platform: windows
          - name: macos
            runner: macos-latest
            platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install zig (for Linux manylinux builds)
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build wheels (Linux)
        if: matrix.platform == 'linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist --zig --interpreter python3.10

      - name: Verify Linux wheels are abi3
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels were built in dist/" >&2
            exit 1
          fi

          for wheel in "${wheels[@]}"; do
            name="$(basename "$wheel")"
            if [[ "$name" != *abi3* ]]; then
              echo "Expected abi3 Linux wheel, got: $name" >&2
              exit 1
            fi
          done

      - name: Build wheels (Windows/macOS)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload sdist to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-pypy-wheels:
    name: Build PyPy ${{ matrix.python-version }} wheel on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        target: [linux-x86_64, linux-arm64, windows, macos]
        include:
          - target: linux-x86_64
            name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            build-args: --release --locked --strip --out dist --interpreter python --no-default-features --zig --compatibility manylinux_2_28
          - target: linux-arm64
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            build-args: --release --locked --strip --out dist --interpreter python --no-default-features --zig --compatibility manylinux_2_28
          - target: windows
            name: windows
            runner: windows-latest
            platform: windows
            build-args: --release --locked --strip --out dist --interpreter python --no-default-features
          - target: macos
            name: macos
            runner: macos-latest
            platform: macos
            build-args: --release --locked --strip --out dist --interpreter python --no-default-features

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PyPy
        uses: actions/setup-python@v6
        with:
          # Pin the new release so 3.12 is downloaded even before runner caches update.
          python-version: pypy${{ matrix.python-version }}-v8.0.0

      - name: Install zig (for Linux manylinux builds)
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build PyPy wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # The manylinux images do not yet contain PyPy 3.12, so use the
          # interpreter installed above. Zig supplies the portable Linux ABI.
          container: off
          args: ${{ matrix.build-args }}

      - name: Verify PyPy wheel tag
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "Expected exactly one PyPy wheel, found ${#wheels[@]}" >&2
            exit 1
          fi

          expected_tag="pp${{ matrix.python-version }}"
          expected_tag="${expected_tag/./}"
          name="$(basename "${wheels[0]}")"
          if [[ "$name" != *"-${expected_tag}-"* ]]; then
            echo "Expected a ${expected_tag} wheel, got: $name" >&2
            exit 1
          fi

      - name: Smoke-test PyPy wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import os, platform, sys, tempfile; os.chdir(tempfile.gettempdir()); import scraper_rs; assert platform.python_implementation() == 'PyPy'; assert f'{sys.version_info.major}.{sys.version_info.minor}' == '${{ matrix.python-version }}'; assert scraper_rs.__version__"

      - name: Upload PyPy wheel as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pypy-${{ matrix.python-version }}-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload PyPy wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-pypy-wheels, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/scraper-rust
    permissions:
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: 'sdist'
          merge-multiple: true

      - name: Validate distributions
        run: |
          ls -lah dist/
          python - <<'PY'
          from pathlib import Path
          import struct
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))

          if len(wheels) != 12:
              raise SystemExit(f"Expected 12 platform wheels, found {len(wheels)}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected 1 source distribution, found {len(sdists)}")

          for wheel in wheels:
              data = wheel.read_bytes()
              eocd = data.rfind(b"PK\x05\x06")
              if eocd < 0 or eocd + 22 > len(data):
                  raise SystemExit(f"{wheel}: missing or truncated ZIP end record")

              comment_length = struct.unpack_from("<H", data, eocd + 20)[0]
              archive_end = eocd + 22 + comment_length
              if comment_length:
                  raise SystemExit(f"{wheel}: ZIP comments are not accepted by PyPI")
              if archive_end != len(data):
                  trailing = len(data) - archive_end
                  raise SystemExit(f"{wheel}: contains {trailing} trailing bytes")

              with zipfile.ZipFile(wheel) as archive:
                  bad_member = archive.testzip()
                  if bad_member is not None:
                      raise SystemExit(f"{wheel}: corrupt member {bad_member}")

          with tarfile.open(sdists[0], mode="r:gz") as archive:
              archive.getmembers()

          pypy_wheels = [wheel for wheel in wheels if "-pp311-" in wheel.name or "-pp312-" in wheel.name]
          if len(pypy_wheels) != 8:
              raise SystemExit(f"Expected 8 PyPy wheels, found {len(pypy_wheels)}")

          print(f"Validated {len(wheels)} wheels and {len(sdists)} source distribution")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
